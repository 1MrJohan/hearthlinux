[project]
name = "hs-bg-tracker"
version = "0.1.0"
description = "Linux-native Hearthstone Battlegrounds tracker/overlay"
requires-python = ">=3.12"
dependencies = [
    "hslog==1.20.0",
    # Not a transitive detail: this package *is* the GameTag table, and an
    # unknown tag makes hslog raise, which drops the whole TAG_CHANGE line.
    # A patch that ships new tags therefore silently loses log lines until
    # this floor moves — 9.20.12 is what covers the ten BG36 tags (Dark Gift,
    # Rally, BACON_IN_COMBAT_PHASE) the old 9.20.6 choked on. hslog itself
    # requires it unpinned, so an existing venv never upgrades on its own.
    "hearthstone>=9.20.12",
    "platformdirs>=4",
]

[project.optional-dependencies]
# python-xlib is not optional *within* the overlay: Hearthstone runs on
# XWayland, so the leaderboard hover column detects the pointer by polling the
# X11 cursor rather than capturing it (which would break the game's own
# board preview). Without it the scout popout silently never fires.
overlay = ["PyGObject>=3.50", "python-xlib>=0.33"]

[tool.setuptools.packages.find]
include = ["bgtracker*"]

# Cinzel / Alegreya Sans (SIL OFL) ship with the package: the overlay
# registers them at runtime rather than requiring a system font install.
[tool.setuptools.package-data]
bgtracker = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
