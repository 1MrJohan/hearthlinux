[project]
name = "hs-bg-tracker"
version = "0.1.0"
description = "Linux-native Hearthstone Battlegrounds tracker/overlay"
requires-python = ">=3.12"
dependencies = [
    "hslog==1.18.0",
    "platformdirs>=4",
]

[project.optional-dependencies]
overlay = ["PyGObject>=3.50"]

[tool.setuptools.packages.find]
include = ["bgtracker*"]

# Cinzel / Alegreya Sans (SIL OFL) ship with the package: the overlay
# registers them at runtime rather than requiring a system font install.
[tool.setuptools.package-data]
bgtracker = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
