[project]
name = "hs-bg-tracker"
version = "0.1.0"
description = "Linux-native Hearthstone Battlegrounds tracker/overlay"
requires-python = ">=3.12"
dependencies = [
    "hslog==1.18.0",
    "platformdirs>=4",
]

[project.optional-dependencies]
# python-xlib is not optional *within* the overlay: Hearthstone runs on
# XWayland, so the leaderboard hover column detects the pointer by polling the
# X11 cursor rather than capturing it (which would break the game's own
# board preview). Without it the scout popout silently never fires.
overlay = ["PyGObject>=3.50", "python-xlib>=0.33"]

[tool.setuptools.packages.find]
include = ["bgtracker*"]

# Cinzel / Alegreya Sans (SIL OFL) ship with the package: the overlay
# registers them at runtime rather than requiring a system font install.
[tool.setuptools.package-data]
bgtracker = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
